name: Daily ECE notice update
on:
  schedule:
    - cron: '17 22 * * *' # 07:17 Asia/Seoul; hosting schedules can be delayed.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snu-bridge-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect public academic notices with bounded reads
        run: node scripts/collect.mjs --pages 8 --limit 30
      - name: Generate only new or changed English drafts when configured
        env:
          BRIDGE_LLM_ENDPOINT: ${{ vars.BRIDGE_LLM_ENDPOINT }}
          BRIDGE_LLM_MODEL: ${{ vars.BRIDGE_LLM_MODEL }}
          BRIDGE_LLM_API_KEY: ${{ secrets.BRIDGE_LLM_API_KEY }}
          BRIDGE_MAX_BRIEFS_PER_RUN: '4'
        run: node scripts/generate.mjs
      - run: node scripts/export-student-data.mjs
      - run: npm test
      - run: npm run build
      - name: Save the verified publication data
        run: |
          git config user.name 'SNU Bridge updates'
          git config user.email 'snu-bridge-updates@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official ECE source snapshots and English draft status'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-build
      - uses: actions/deploy-pages@v4
        id: deployment
